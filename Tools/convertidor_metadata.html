<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Convertidor Metadata Qwen → Atlas</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

#preview{
    margin-top:20px;
    border:1px solid #ccc;
    padding:15px;
    max-height:500px;
    overflow:auto;
}

.item{
    padding:10px;
    border-bottom:1px solid #eee;
}

.filename{
    font-weight:bold;
}

.title{
    color:#0a66c2;
}

.location{
    color:#666;
}
</style>
</head>
<body>

<h1>Convertidor Metadata Qwen → Atlas</h1>

<input type="file" id="fileInput" accept=".json">

<br><br>

<button id="downloadBtn" disabled>
Descargar metadata.json
</button>

<div id="preview"></div>

<script>

let atlasMetadata = null;

document.getElementById("fileInput").addEventListener("change", async (e)=>{

    const file = e.target.files[0];

    if(!file) return;

    try{

        const text = await file.text();
        const data = JSON.parse(text);

        if(!Array.isArray(data.items)){
            alert("No parece un metadata.json generado por Qwen.");
            return;
        }

        atlasMetadata = {};

        const preview = document.getElementById("preview");
        preview.innerHTML = "";

        data.items.forEach(item=>{

            atlasMetadata[item.filename] = {
                title: item.title || "",
                location: item.location || "",
                description: item.description || "",
                visible: true
            };

            const div = document.createElement("div");
            div.className = "item";

            div.innerHTML = `
                <div class="filename">${item.filename}</div>
                <div class="title">${item.title || ""}</div>
                <div class="location">${item.location || ""}</div>
            `;

            preview.appendChild(div);
        });

        document.getElementById("downloadBtn").disabled = false;

        alert(
            "Conversión correcta.\n\n" +
            Object.keys(atlasMetadata).length +
            " elementos convertidos."
        );

    }catch(err){

        console.error(err);

        alert(
            "Error leyendo el archivo.\n\n" +
            err.message
        );
    }

});

document.getElementById("downloadBtn").addEventListener("click", ()=>{

    if(!atlasMetadata) return;

    const blob = new Blob(
        [
            JSON.stringify(
                atlasMetadata,
                null,
                4
            )
        ],
        {
            type:"application/json"
        }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "metadata.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(a.href);

});

</script>

</body>
</html>
