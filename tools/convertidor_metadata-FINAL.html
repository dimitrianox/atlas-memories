<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor Metadata Atlas</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    padding:40px;
    text-align:center;
}

.box{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

input{
    margin:20px 0;
}

button{
    padding:12px 24px;
    font-size:16px;
    cursor:pointer;
}

#status{
    margin-top:20px;
    color:#0a7a0a;
}
</style>
</head>
<body>

<div class="box">
    <h1>Conversor Metadata Atlas</h1>

    <p>
        Selecciona el metadata.json generado por Ollama/Gemini
    </p>

    <input type="file" id="fileInput" accept=".json">

    <br>

    <button id="convertBtn">
        Convertir
    </button>

    <div id="status"></div>
</div>

<script>

document.getElementById("convertBtn").addEventListener("click", async () => {

    const file = document.getElementById("fileInput").files[0];

    if(!file){
        alert("Selecciona un archivo JSON");
        return;
    }

    try{

        const text = await file.text();
        const source = JSON.parse(text);

        if(!Array.isArray(source.items)){
            alert("Este archivo no contiene 'items'");
            return;
        }

        const atlas = {};

        source.items.forEach(item => {

            atlas[item.filename] = {
                title: item.title || "",
                location: item.location || "",
                description: "",
                visible: true
            };

        });

        const output = JSON.stringify(atlas, null, 4);

        const blob = new Blob(
            [output],
            {type:"application/json"}
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "metadata.json";
        a.click();

        URL.revokeObjectURL(url);

        document.getElementById("status").textContent =
            `Convertidos ${source.items.length} elementos`;

    }
    catch(err){

        console.error(err);

        alert(
            "Error al leer el JSON.\n\n" +
            err.message
        );

    }

});

</script>

</body>
</html>
